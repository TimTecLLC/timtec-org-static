name: Industry news

on:
  schedule:
    # Every 6 hours. GitHub may start the run a few minutes late.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: industry-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch headlines
        run: python3 scripts/fetch_industry_news.py

      - name: Commit when headlines change
        run: |
          if git diff --quiet -- data/industry-news.json news/index.html sitemap.xml; then
            echo "No headline changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/industry-news.json news/index.html sitemap.xml
          git commit -m "Update industry news headlines"
          git push origin HEAD:main
