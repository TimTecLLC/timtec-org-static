name: Render cited research

on:
  push:
    branches: [main]
    paths:
      - data/cited-research.json
      - scripts/render_cited_research.py
      - scripts/site_chrome.py
      - scripts/news_text.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cited-research
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render published pages
        run: python3 scripts/render_cited_research.py

      - name: Commit rendered pages
        run: |
          if git diff --quiet -- news/cited-in-research sitemap.xml; then
            echo "Rendered pages already match the published entries"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/cited-in-research sitemap.xml
          git commit -m "Render published cited-research pages"
          git push origin HEAD:main
